apply plugin: 'com.android.application'

def jniLibsDir = file("$projectDir/src/main/jniLibs")
def rustManifest = file("${rootDir}/../phonopaper-android/Cargo.toml")
def rustTargets = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningValues = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def releaseSigningConfigured = releaseSigningValues.every { it }

if (releaseSigningValues.any { it } && !releaseSigningConfigured) {
    throw new GradleException(
        'ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ' +
            'and ANDROID_KEY_PASSWORD must all be set for release signing.'
    )
}

def androidVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1') as int
def androidVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'

def rustCommand = { releaseBuild ->
    def command = ['cargo', 'ndk']
    rustTargets.each { abi ->
        command += ['-t', abi]
    }
    command += ['-o', jniLibsDir.absolutePath, 'build', '--manifest-path', rustManifest.absolutePath]
    if (releaseBuild) {
        command += '--release'
    }
    command
}

android {
    namespace 'com.evenfurther.phonopaper'
    compileSdk 37

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.evenfurther.phonopaper'
        minSdk 26
        targetSdk 37
        versionCode androidVersionCode
        versionName androidVersionName
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [jniLibsDir]
        }
    }
}

tasks.register('cleanRustJniLibs', Delete) {
    delete jniLibsDir
}

tasks.register('buildRustDebug', Exec) {
    dependsOn tasks.named('cleanRustJniLibs')
    workingDir rootDir.parentFile
    commandLine rustCommand(false)
    environment 'CARGO_BUILD_RUSTFLAGS', ''
    environment 'RUSTFLAGS', ''
    doFirst {
        jniLibsDir.mkdirs()
    }
}

tasks.register('buildRustRelease', Exec) {
    dependsOn tasks.named('cleanRustJniLibs')
    workingDir rootDir.parentFile
    commandLine rustCommand(true)
    environment 'CARGO_BUILD_RUSTFLAGS', ''
    environment 'RUSTFLAGS', ''
    doFirst {
        jniLibsDir.mkdirs()
    }
}

tasks.configureEach {
    if (name == 'preDebugBuild') {
        dependsOn tasks.named('buildRustDebug')
    }
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('buildRustRelease')
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.core:core-ktx:1.19.1'
}
