name: Android main release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: ""
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}

jobs:
  publish:
    name: Publish signed APK
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_RELEASE_KEYSTORE_BASE64 is not configured' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phonopaper-release.jks"
          chmod 600 "$RUNNER_TEMP/phonopaper-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phonopaper-release.jks" >> "$GITHUB_ENV"

      - name: Set snapshot version
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "ANDROID_VERSION_CODE=$CI_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.0-main.$CI_RUN_NUMBER+${CI_HEAD_SHA:0:7}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-main-$CI_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-app
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -F "package: name='com.evenfurther.phonopaper' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -F "lib/$abi/libphonopaper_android.so"
          done

      - name: Prepare release assets
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk phonopaper-android-main.apk
          sha256sum phonopaper-android-main.apk > phonopaper-android-main.apk.sha256

      - name: Publish immutable main snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving the immutable snapshot unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            phonopaper-android-main.apk \
            phonopaper-android-main.apk.sha256 \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Android main build $ANDROID_VERSION_CODE" \
            --notes "Signed Android snapshot of main at $HEAD_SHA. Built and tested by $CI_RUN_URL."
