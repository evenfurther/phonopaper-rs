name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.2.11394342
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install CMake
        run: |
          sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "cmake;3.10.2" || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Add Android targets to Rust
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Set Android linkers
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV

      - name: Build phonopaper-rs for Android
        run: |
          cd phonopaper-rs
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target aarch64-linux-android
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target armv7-linux-androideabi
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target i686-linux-android
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target x86_64-linux-android

      - name: Build phonopaper-android library
        run: |
          cd phonopaper-android
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target aarch64-linux-android
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target armv7-linux-androideabi
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target i686-linux-android
          RUSTFLAGS="-C target-cpu=generic" cargo build --release --target x86_64-linux-android

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p phonopaper-android/app/src/main/jniLibs/arm64-v8a
          mkdir -p phonopaper-android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p phonopaper-android/app/src/main/jniLibs/x86
          mkdir -p phonopaper-android/app/src/main/jniLibs/x86_64
          
          cp target/aarch64-linux-android/release/libphonopaper_android.so phonopaper-android/app/src/main/jniLibs/arm64-v8a/libphonopaper_android.so
          cp target/armv7-linux-androideabi/release/libphonopaper_android.so phonopaper-android/app/src/main/jniLibs/armeabi-v7a/libphonopaper_android.so
          cp target/i686-linux-android/release/libphonopaper_android.so phonopaper-android/app/src/main/jniLibs/x86/libphonopaper_android.so
          cp target/x86_64-linux-android/release/libphonopaper_android.so phonopaper-android/app/src/main/jniLibs/x86_64/libphonopaper_android.so

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.3-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.3-bin.zip -d /tmp
          echo "GRADLE_HOME=/tmp/gradle-8.3" >> $GITHUB_ENV
          echo "PATH=/tmp/gradle-8.3/bin:$PATH" >> $GITHUB_ENV

      - name: Generate Gradle wrapper
        run: |
          cd phonopaper-android
          gradle wrapper --gradle-version 8.3

      - name: Build Android app with Gradle
        run: |
          cd phonopaper-android
          ./gradlew assembleRelease
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonopaper-android-apk
          path: phonopaper-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
