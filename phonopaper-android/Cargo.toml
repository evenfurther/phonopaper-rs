[package]
name = "phonopaper-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "phonopaper_android"
crate-type = ["cdylib"]

[dependencies]
phonopaper-rs = { path = "../phonopaper-rs" }
image.workspace = true
jni = "0.21"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.4", features = ["native-activity"] }
android_logger = "0.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
