[package]
name = "phonopaper-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Encode and decode audio in the PhonoPaper format — a printable grayscale spectrogram readable by a phone camera."
keywords = ["phonopaper", "audio", "spectrogram", "encode", "decode"]
categories = ["multimedia::audio", "encoding"]

[lints]
workspace = true

[features]
# Neural-network pattern detector (`decode::nn`): finds a PhonoPaper sheet
# and its four corners in a camera frame.  Pulls in burn (inference only,
# CPU `ndarray` backend) and embeds the ≈ 1.2 MB trained weights.
nn-detector = ["dep:burn"]

[dependencies]
# Inference engine for the optional neural-network detector.  Neither the
# `train` nor the `autodiff` feature is needed, which keeps the dependency
# tree small enough for the Android `cdylib`.
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"], optional = true }
# Image loading and saving (PNG, JPEG)
image = "0.25"
# WAV file reading and writing
hound = "3.5"
# FFT for audio analysis (WAV → spectrogram)
rustfft = "6.4"
# Convenience for numeric operations
num-complex = "0.4"
# Step-by-step PDF writer (for vector::spectrogram_to_pdf)
pdf-writer = "0.15"
# Deflate compression for embedding rasters in PDF XObjects
miniz_oxide = "0.9"
# Base64 encoding/decoding for SVG data URIs
base64 = "0.23"
# Derive macros for the error type
thiserror = "2"
# MP3 decoding — only the mp3 codec bundle, no other formats
symphonia = { version = "0.6.0", default-features = false, features = ["mp3"] }

[dev-dependencies]
imageproc = "0.27.0"
nalgebra = "0.35.0"
tempfile = "3"

[dev-dependencies.clap]
version = "4"
features = ["derive"]

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[dev-dependencies.iai-callgrind]
version = "0.16"

[[example]]
name = "bench_decode"

[[example]]
name = "gen_sines"

[[example]]
name = "compare_android"

[[example]]
name = "robust_decode"

[[example]]
name = "angine"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode_iai"
harness = false

[[bench]]
name = "encode_iai"
harness = false
