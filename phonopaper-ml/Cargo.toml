[workspace]
members = ["phonopaper-dataset", "phonopaper-train"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Samuel Tardieu <sam@rfc1149.net>"]
license = "Apache-2.0 OR MIT"
repository = "https://git.sr.ht/~rfc1149/phonopaper-rs"
publish = false

[workspace.lints.clippy]
pedantic = "warn"

# Training on the CPU is much faster with optimisations; keep debug assertions
# so that bugs in the data pipeline surface early.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
